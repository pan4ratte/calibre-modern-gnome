<?xml version="1.0" encoding="UTF-8"?>
<!-- Background color. A tilted paint bucket pouring a drop over a line, drawn like Yaru's 256px
     format-text-* glyphs: #4d4d4d to #151515 gradient with a 4px white outline. The light area is the
     air above the liquid, which stays level while the bucket tilts. -->
