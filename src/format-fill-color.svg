    <g transform="translate(100 123) rotate(45) scale(0.96)"><path d="M-58 -58 H58 L46.60 44.00 A18 18 0 0 1 28.60 62 H-28.60 A18 18 0 0 1 -46.60 44.00 Z"/><rect x="-78" y="-72" width="142" height="16" rx="8"/></g>
    <path d="M196 138 C196 138 178 162 178 173 A18 18 0 0 0 214 173 C214 162 196 138 196 138 Z"/>
    <rect x="32" y="206" width="192" height="24" rx="12"/>
  </g>
  <path transform="translate(100 123) rotate(45) scale(0.96)" d="M-42.80 -56.00 L42.80 -56.00 L42.80 -55.98 L-35.02 21.83 Z" fill="url(#inside)" stroke="url(#inside)" stroke-width="6" stroke-linejoin="round"/>
